name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenSpec specs and changes
        run: npx --yes @fission-ai/openspec@2 validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: 0

      - name: Restore
        run: dotnet restore JobFit.slnx

      - name: Build
        run: dotnet build JobFit.slnx --no-restore -c Release

      - name: Test
        run: dotnet test JobFit.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
