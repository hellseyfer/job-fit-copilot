name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenSpec specs and changes
        run: npx --yes @fission-ai/openspec@2 validate --all --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: 0

      - name: Restore
        run: dotnet restore JobFit.slnx

      - name: Build
        run: dotnet build JobFit.slnx --no-restore -c Release

      - name: Test
        run: dotnet test JobFit.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  evals:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-qwen2.5-3b-nomic-embed-text-v1

      - name: Start Ollama and pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          sudo systemctl disable ollama || true
          for i in $(seq 1 15); do
            ss -tln | grep -q ':11434 ' || break
            sleep 1
          done
          RUNNER_TRACKING_ID="" nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            ollama list >/dev/null 2>&1 && break
            sleep 1
          done
          ollama list
          ollama pull qwen2.5:3b
          ollama pull nomic-embed-text
        env:
          OLLAMA_MODELS: /home/runner/.ollama/models
          OLLAMA_MAX_LOADED_MODELS: "2"
          OLLAMA_KEEP_ALIVE: "30m"

      - name: Run evaluation quality gate
        run: |
          mkdir -p EvalResults
          set +e
          JOBFIT_EVAL_REPORT="$GITHUB_STEP_SUMMARY" dotnet test tests/JobFit.Evals -c Release --logger "trx" --results-directory EvalResults
          status=$?
          set -e
          if [ -f "${GITHUB_STEP_SUMMARY}.json" ]; then
            cp "${GITHUB_STEP_SUMMARY}.json" EvalResults/eval-report.json
          fi
          exit $status
        env:
          OLLAMA_ENDPOINT: http://localhost:11434
          JOBFIT_EVAL_REQUIRED: "true"

      - name: Upload evaluation report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: EvalResults
